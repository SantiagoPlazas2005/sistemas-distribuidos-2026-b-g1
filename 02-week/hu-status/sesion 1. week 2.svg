<svg width="1200" height="990" viewBox="0 0 1200 990" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<title>Planning: Bounded Contexts, Architecture Decision and ADR</title>
<rect x="0" y="0" width="1200" height="990" fill="#0f172a"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Header -->
<rect x="0" y="0" width="1200" height="100" fill="#1e293b"/>
<rect x="0" y="99" width="1200" height="2" fill="#334155"/>
<text x="40" y="46" fill="#f8fafc" font-size="25" font-weight="bold">Planning: Bounded Contexts &amp; Architecture Decisions</text>
<text x="40" y="74" fill="#94a3b8" font-size="14">Context map · Decision path · ADR · Sprint backlog</text>
<rect x="980" y="30" width="180" height="40" rx="20" fill="#0f2942" stroke="#2563eb" stroke-width="1"/>
<text x="1070" y="55" text-anchor="middle" fill="#93c5fd" font-size="12.5" font-weight="bold">SISTEMAS DISTRIBUIDOS</text>

<!-- PANEL 1 -->
<rect x="40" y="120" width="550" height="740" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<circle cx="75" cy="160" r="18" fill="#2563eb"/>
<text x="75" y="165" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">1</text>
<text x="105" y="156" fill="#f8fafc" font-size="17" font-weight="bold">Map the Domain &amp; Choose Architecture</text>
<text x="105" y="176" fill="#94a3b8" font-size="12.5">Context map first, then a decision path — not by fashion</text>
<line x1="60" y1="195" x2="570" y2="195" stroke="#334155" stroke-width="1"/>

<rect x="60" y="205" width="510" height="46" rx="8" fill="#0f2942" stroke="#2563eb" stroke-width="1"/>
<text x="75" y="223" fill="#dbeafe" font-size="12">Boundaries follow business language and data ownership —</text>
<text x="75" y="240" fill="#dbeafe" font-size="12">not database tables or UI screens.</text>

<!-- Context map -->
<text x="60" y="272" fill="#f8fafc" font-size="13.5" font-weight="bold">Context map (example)</text>

<rect x="265" y="280" width="120" height="50" rx="8" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
<text x="325" y="300" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="bold">Orders</text>
<text x="325" y="316" text-anchor="middle" fill="#ddd6fe" font-size="10.5">cart, checkout</text>

<rect x="70" y="365" width="140" height="50" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="1"/>
<text x="140" y="385" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="bold">Payments</text>
<text x="140" y="401" text-anchor="middle" fill="#99f6e4" font-size="10.5">charge, refund</text>

<rect x="255" y="365" width="140" height="50" rx="8" fill="#374151" stroke="#64748b" stroke-width="1"/>
<text x="325" y="385" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="bold">Inventory</text>
<text x="325" y="401" text-anchor="middle" fill="#cbd5e1" font-size="10.5">stock, reserve</text>

<rect x="440" y="365" width="140" height="50" rx="8" fill="#7c2d12" stroke="#ea580c" stroke-width="1"/>
<text x="510" y="385" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="bold">Shipping</text>
<text x="510" y="401" text-anchor="middle" fill="#fed7aa" font-size="10.5">deliver, track</text>

<line x1="300" y1="330" x2="150" y2="365" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="192" y="352" fill="#94a3b8" font-size="10.5" font-style="italic">places</text>
<line x1="325" y1="330" x2="325" y2="365" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="330" y="352" fill="#94a3b8" font-size="10.5" font-style="italic">reserves</text>
<line x1="355" y1="330" x2="490" y2="365" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="405" y="352" fill="#94a3b8" font-size="10.5" font-style="italic">ships</text>

<!-- Decision path -->
<text x="60" y="450" fill="#f8fafc" font-size="13.5" font-weight="bold">Choose the architecture (decision path)</text>

<circle cx="72" cy="475" r="11" fill="#2563eb"/>
<text x="72" y="479" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">1</text>
<text x="92" y="472" fill="#e2e8f0" font-size="12">Do parts need to scale / deploy independently?</text>
<text x="92" y="488" fill="#94a3b8" font-size="11">No → start with a modular monolith.</text>

<circle cx="72" cy="515" r="11" fill="#2563eb"/>
<text x="72" y="519" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">2</text>
<text x="92" y="512" fill="#e2e8f0" font-size="12">If yes: are the boundaries real (bounded context)?</text>
<text x="92" y="528" fill="#94a3b8" font-size="11">No → refactor modules first, don't extract yet.</text>

<circle cx="72" cy="555" r="11" fill="#2563eb"/>
<text x="72" y="559" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">3</text>
<text x="92" y="552" fill="#e2e8f0" font-size="12">If both are true: extract that part as a service.</text>

<rect x="60" y="580" width="510" height="55" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="1"/>
<text x="75" y="600" fill="#f0fdfa" font-size="12" font-weight="bold">Rule</text>
<text x="75" y="618" fill="#99f6e4" font-size="11.5">Extract a service only when a real boundary AND a real</text>
<text x="75" y="632" fill="#99f6e4" font-size="11.5">scaling/deploy need coincide — not by fashion.</text>

<rect x="60" y="655" width="510" height="90" rx="8" fill="#3b0d0d" stroke="#7f1d1d" stroke-width="1"/>
<text x="75" y="675" fill="#fecaca" font-size="12" font-weight="bold">⚠ Common mistake</text>
<text x="75" y="694" fill="#fca5a5" font-size="11.5">Choosing "12 microservices" before a real boundary or</text>
<text x="75" y="710" fill="#fca5a5" font-size="11.5">scaling need exists — this is the trap that kills projects</text>
<text x="75" y="726" fill="#fca5a5" font-size="11.5">(shared DB + coupled deploys = a distributed monolith).</text>

<rect x="60" y="760" width="510" height="80" rx="8" fill="#0f2942" stroke="#2563eb" stroke-width="1"/>
<text x="75" y="780" fill="#dbeafe" font-size="12" font-weight="bold">Common mistakes to avoid</text>
<text x="75" y="798" fill="#bfdbfe" font-size="11">• Drawing the context map from DB tables, not business language</text>
<text x="75" y="814" fill="#bfdbfe" font-size="11">• Writing an ADR that hides the rejected alternatives</text>
<text x="75" y="830" fill="#bfdbfe" font-size="11">• Stories without testable acceptance criteria</text>

<!-- PANEL 2 -->
<rect x="610" y="120" width="550" height="740" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<circle cx="645" cy="160" r="18" fill="#2563eb"/>
<text x="645" y="165" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="bold">2</text>
<text x="675" y="156" fill="#f8fafc" font-size="17" font-weight="bold">Record the Decision (ADR) &amp; Backlog</text>
<text x="675" y="176" fill="#94a3b8" font-size="12.5">Document why, then slice into sprint work</text>
<line x1="630" y1="195" x2="1140" y2="195" stroke="#334155" stroke-width="1"/>

<text x="630" y="222" fill="#f8fafc" font-size="13.5" font-weight="bold">ADR — Architecture Decision Record</text>
<text x="630" y="240" fill="#94a3b8" font-size="11.5">docs/adr/adr-001-architecture.md</text>

<rect x="630" y="252" width="240" height="70" rx="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
<text x="644" y="272" fill="#f8fafc" font-size="12.5" font-weight="bold">Context</text>
<text x="644" y="290" fill="#cbd5e1" font-size="11">The forces and constraints</text>
<text x="644" y="304" fill="#cbd5e1" font-size="11">behind the decision.</text>

<rect x="890" y="252" width="240" height="70" rx="8" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
<text x="904" y="272" fill="#f8fafc" font-size="12.5" font-weight="bold">Decision</text>
<text x="904" y="290" fill="#ddd6fe" font-size="11">What was chosen, stated</text>
<text x="904" y="304" fill="#ddd6fe" font-size="11">clearly and concretely.</text>

<rect x="630" y="332" width="240" height="70" rx="8" fill="#7c2d12" stroke="#ea580c" stroke-width="1"/>
<text x="644" y="352" fill="#f8fafc" font-size="12.5" font-weight="bold">Alternatives</text>
<text x="644" y="370" fill="#fed7aa" font-size="11">Options considered and</text>
<text x="644" y="384" fill="#fed7aa" font-size="11">why they were rejected.</text>

<rect x="890" y="332" width="240" height="70" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="1"/>
<text x="904" y="352" fill="#f8fafc" font-size="12.5" font-weight="bold">Consequences</text>
<text x="904" y="370" fill="#99f6e4" font-size="11">Benefits and costs —</text>
<text x="904" y="384" fill="#99f6e4" font-size="11">good and bad, both stated.</text>

<rect x="630" y="415" width="500" height="40" rx="8" fill="#0f2942" stroke="#2563eb" stroke-width="1"/>
<text x="645" y="440" fill="#dbeafe" font-size="11.5">Immutable once accepted — a change becomes a new ADR that supersedes it.</text>

<rect x="630" y="470" width="500" height="90" rx="8" fill="#3b2b06" stroke="#b45309" stroke-width="1"/>
<text x="645" y="490" fill="#fde68a" font-size="12" font-weight="bold">The "12 microservices on day one" trap</text>
<text x="645" y="509" fill="#fcd34d" font-size="11.5">A teammate proposes splitting into many services "because</text>
<text x="645" y="525" fill="#fcd34d" font-size="11.5">big companies do it." Refute with evidence: premature</text>
<text x="645" y="541" fill="#fcd34d" font-size="11.5">decomposition multiplies ops cost with no scaling need yet.</text>

<rect x="630" y="580" width="500" height="120" rx="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
<text x="645" y="600" fill="#f8fafc" font-size="12" font-weight="bold">Slice the decision into a sprint story</text>
<text x="645" y="620" fill="#e2e8f0" font-size="11.5">"As the team, we want the Catalog module isolated</text>
<text x="645" y="636" fill="#e2e8f0" font-size="11.5">behind a port, so it can later be extracted as a service."</text>
<text x="645" y="658" fill="#94a3b8" font-size="11" font-weight="bold">Acceptance criteria:</text>
<text x="645" y="674" fill="#94a3b8" font-size="11">• No other module imports Catalog internals</text>
<text x="645" y="690" fill="#94a3b8" font-size="11">• All access goes through the port · tests pass</text>

<text x="630" y="735" fill="#f8fafc" font-size="13.5" font-weight="bold">Planning loop</text>
<text x="630" y="754" fill="#cbd5e1" font-size="11.5">Refine the backlog → decide (architecture, boundaries,</text>
<text x="630" y="770" fill="#cbd5e1" font-size="11.5">contracts) → record it (ADR) → slice into stories with</text>
<text x="630" y="786" fill="#cbd5e1" font-size="11.5">testable acceptance criteria for the sprint.</text>

<rect x="630" y="805" width="500" height="45" rx="8" fill="#0f2942" stroke="#2563eb" stroke-width="1"/>
<text x="645" y="825" fill="#dbeafe" font-size="11.5" font-style="italic">A decision without an ADR is a rumor; a story without</text>
<text x="645" y="840" fill="#dbeafe" font-size="11.5" font-style="italic">acceptance criteria is a wish.</text>

<!-- Bottom flow -->
<text x="600" y="900" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="bold">This week's loop</text>

<rect x="80" y="915" width="230" height="40" rx="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
<text x="195" y="940" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">1. Refine backlog</text>
<line x1="310" y1="935" x2="350" y2="935" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="350" y="915" width="230" height="40" rx="8" fill="#4c1d95" stroke="#7c3aed" stroke-width="1"/>
<text x="465" y="940" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">2. Decide (architecture)</text>
<line x1="580" y1="935" x2="620" y2="935" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="620" y="915" width="230" height="40" rx="8" fill="#134e4a" stroke="#0d9488" stroke-width="1"/>
<text x="735" y="940" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">3. Record (ADR)</text>
<line x1="850" y1="935" x2="890" y2="935" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="890" y="915" width="230" height="40" rx="8" fill="#7c2d12" stroke="#ea580c" stroke-width="1"/>
<text x="1005" y="940" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">4. Slice into stories</text>

<text x="600" y="975" text-anchor="middle" fill="#64748b" font-size="12">Principle: split by capability, not by fashion — document the "why" so your team can defend it months later.</text>
</svg>
